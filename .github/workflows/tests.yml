name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # In a high-quality repo, use: pip install -r requirements.txt
          # For now, we install the core suite in one clean step:
          pip install pytest httpx pytest-asyncio

      - name: Run gate-exec-write hook tests
        run: |
          chmod +x tests/test_gate_exec_write.sh
          ./tests/test_gate_exec_write.sh

      - name: Run Python tests
        # This automatically finds all files starting with test_ in the tests/ directory
        run: python3 -m pytest tests/
